name: Exercise cluster actions

# Prepared, not pointed: with ZAPHOD_CLUSTER_URL unset this no-ops with a notice.
# The URL is expected to be the base of a lezz demo registry (`/cluster`), and
# the token, when set, allows the write step.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: probe or join
        required: false
        default: probe
  repository_dispatch:
    types: [zaphod-cluster]

permissions:
  contents: read

concurrency:
  group: exercise-cluster
  cancel-in-progress: false

jobs:
  exercise:
    name: Read the registry, optionally join
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ vars.ZAPHOD_CLUSTER_URL }}
      TOKEN: ${{ secrets.ZAPHOD_CLUSTER_TOKEN }}
      ACTION: ${{ github.event.inputs.action || 'probe' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the target
        run: |
          if [ -z "${TARGET}" ]; then
            echo "::notice::ZAPHOD_CLUSTER_URL is not set — nothing to exercise"
            exit 0
          fi
          case "${TARGET}" in
            https://*) ;;
            *) echo "::error::refusing a non-https cluster target"; exit 1 ;;
          esac

      - name: Read the registry
        if: env.TARGET != ''
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl -sS -o "${body}" -w '%{http_code}' \
            --max-time 15 "${TARGET%/}/cluster")" || {
            echo "::error::registry unreachable"; exit 1;
          }
          if [ "${status}" != "200" ]; then
            echo "::error::registry answered ${status}"; exit 1;
          fi
          jq -e . "${body}" >/dev/null || { echo "::error::registry did not answer JSON"; exit 1; }
          echo "registry: $(jq 'length' "${body}") cluster(s)"
          jq -r 'to_entries[] | "  \(.key): alarm-a=\(.value.alarm_a // "—") alarm-b=\(.value.alarm_b // "—")"' "${body}"

      # The write half is opt-in: no token, no cluster action. A join is a
      # signed exercise registration, exactly like the webhook payload, so the
      # receiver can verify it without holding a secret.
      - name: Join (signed)
        if: env.TARGET != '' && env.TOKEN != '' && env.ACTION == 'join'
        run: |
          set -euo pipefail
          payload="$(mktemp)"
          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            --arg ts "$(date -u +%FT%TZ)" \
            '{action: "exercise-join", repo: $repo, sha: $sha, ts: $ts, fixture: "zaphod-beeblebrox"}' \
            > "${payload}"
          ssh-keygen -Y sign -f keys/id_ed25519 -n zaphod-cluster "${payload}" >/dev/null
          signature="$(base64 -w0 "${payload}.sig")"

          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 15 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-Zaphod-Signer: zaphod-beeblebrox" \
            -H "X-Zaphod-Namespace: zaphod-cluster" \
            -H "X-Zaphod-Signature: ${signature}" \
            --data-binary "@${payload}" \
            "${TARGET%/}/cluster/zaphod")" || {
            echo "::error::cluster action failed"; exit 1;
          }
          echo "join → ${status}"
          case "${status}" in
            2??) ;;
            *) echo "::error::cluster answered ${status}"; exit 1 ;;
          esac

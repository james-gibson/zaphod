name: Red team

# The protection is only worth what its worst-tested case says it is worth, so the
# mutation suite runs on every push, on a timer, and on demand. A passing run
# means ACME changed everything it owns and the guard refused all of it.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect:
    name: ACME cannot edit their way in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install jq and age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq age

      - name: Build (the 42i reader is the library's own arithmetic)
        run: |
          go build ./...
          test -z "$(gofmt -l cmd)" || { echo "::error::gofmt needed"; gofmt -l cmd; exit 1; }

      - name: The genuine artifacts verify
        run: scripts/cluster-verify.sh

      - name: Every tampered artifact is refused
        run: scripts/redteam.sh

      # Zaphod's own update: one attempt, no manual edits, and the certificate
      # follows the key. This is the permitted path the red team is measured
      # against — an actor in lane.
      - name: Zaphod rotates on the first attempt
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -R . "$work/repo"
          cd "$work/repo"
          # The cluster's identity, generated for this job and never committed. Only
          # the running identity can authorise a rotation.
          scripts/identity.sh init
          ssh-keygen -q -t ed25519 -N '' -C "zaphod-beeblebrox DO NOT USE" -f "$work/newkey"
          scripts/rotate.sh --reason "ci rotation" --new-key "$work/newkey" | tee "$work/out"
          grep -q "rotation accepted on the first attempt" "$work/out"
          scripts/cluster-verify.sh >/dev/null
          scripts/rotation-verify.sh
          test "$(jq '.seq' cluster/rotations/*.json | sort -n | tail -1)" = "1"
          test "$(jq -r .subject_fingerprint cluster/certificate.json)" = "$(awk '{print $2}' keys/FINGERPRINT)"
          scripts/guard-keys.sh

      # A suite that passes because nothing verifies is worse than no suite. Each
      # layer of the guard is removed in a throwaway copy and the suite must go
      # red: with the pin gone ACME's own key is accepted; with the allowed
      # version gone a correctly signed change is accepted and the 42i reading
      # drifts.
      - name: Each guard layer is load-bearing
        run: scripts/teeth.sh
